  <image href="logo-mark-topo.svg" x="86" y="70" width="72" height="72" preserveAspectRatio="xMidYMid meet"/>
  <text x="172" y="122" fill="#F2F5FA" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.4">glade<tspan fill="#A89AFF">.sh</tspan></text>

  <circle cx="94" cy="237" r="5" fill="#76D8E6"/>
  <text x="112" y="245" fill="#76D8E6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4.4">LOCAL APEX RUNTIME</text>

  <g font-family="Inter, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-3.4">
    <text x="84" y="338" fill="#F2F5FA">Test your Apex</text>
    <text x="84" y="424" fill="url(#headline)">before you</text>
    <text x="84" y="510" fill="url(#headline)">deploy it.</text>
  </g>
  <text x="88" y="574" fill="#9AA8BB" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Open source · macOS &amp; Linux · No org login needed</text>

  <rect x="700" y="150" width="412" height="330" rx="18" fill="#0C131C" stroke="#8A79FF" stroke-opacity="0.34" stroke-width="1.5"/>
