    <text x="758" y="351" fill="#7DDBA9" font-family="IBM Plex Mono, monospace" font-size="17">.createsAccount</text>
    <rect x="1002" y="302" width="82" height="32" rx="7" fill="#7DDBA9" fill-opacity="0.1" stroke="#7DDBA9" stroke-opacity="0.4"/>
