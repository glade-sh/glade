<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Glade. Test your Apex before you deploy it. Open source, macOS and Linux.">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1119"/>
      <stop offset="0.6" stop-color="#0E1524"/>
      <stop offset="1" stop-color="#151A36"/>
    </linearGradient>
    <radialGradient id="glow-violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 120) rotate(90) scale(460 620)">
      <stop stop-color="#8A79FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8A79FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 600) rotate(90) scale(300 420)">
      <stop stop-color="#76D8E6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#76D8E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="88" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78DDEA"/>
      <stop offset="0.55" stop-color="#829EFF"/>
      <stop offset="1" stop-color="#A080FF"/>
    </linearGradient>
    <linearGradient id="contour" x1="560" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#829EFF"/>
      <stop offset="1" stop-color="#76D8E6"/>
    </linearGradient>
    <clipPath id="screen-clip">
      <rect x="700" y="150" width="412" height="330" rx="18"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#card-bg)"/>
  <rect width="1200" height="630" fill="url(#glow-violet)"/>
  <rect width="1200" height="630" fill="url(#glow-cyan)"/>

  <g stroke="url(#contour)" stroke-width="1.5" stroke-linecap="round">
    <path d="M610 -20C668 84 792 62 866 -24" opacity="0.2"/>
