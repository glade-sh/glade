name: glade-playground
region: nyc
services:
  - name: web
    # The Apex parser is vendored into the repo (third_party/glade-apex-parser),
    # so App Platform can build the image directly from the connected source.
    # Update `repo`/`branch` to match your GitHub connection.
    github:
      repo: glade-sh/glade
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /playground/
    envs:
      - key: PORT
        value: "8080"
        scope: RUN_TIME
