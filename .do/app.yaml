name: glade-playground
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /playground/
    envs:
      - key: PORT
        value: "8080"
        scope: RUN_TIME
    run_command: /bin/sh -c 'exec glade playground --examples --public --addr 0.0.0.0:${PORT:-8080}'
domains:
  - domain: play.glade.sh
    type: PRIMARY
