<template>
    <section data-probe="vf-base">
        <lightning-card title="VF Base Card">
            <lightning-button label="Save VF"></lightning-button>
            <lightning-input label="VF Name" value="Ada"></lightning-input>
            <lightning-datatable
                key-field="id"
                columns={columns}
                data={rows}>
            </lightning-datatable>
            <lightning-record-form
                object-api-name="Account"
                record-id={recordId}
                fields={fields}>
            </lightning-record-form>
            <lightning-tabset>
                <lightning-tab label="Details" value="details" onactive={handleTabActive}>
                    <p class="tab-status">{activeTab}</p>
                </lightning-tab>
            </lightning-tabset>
        </lightning-card>
    </section>
</template>
