version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /third_party/glade-apex-parser
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /contrib/vscode-glade
      - /internal/playground/web
      - /lwcruntime
      - /site
      - /third_party/lwc
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
