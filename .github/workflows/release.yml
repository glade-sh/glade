name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for artifact names, or the published vX.Y.Z tag to distribute.
        required: false
        default: dev
      glade_tools_sha:
        description: Full lowercase 40-hex glade-tools commit with Salesforce authority.
        required: true
        type: string
      distribute_only:
        description: Publish only downloads.glade.sh for the existing published GitHub Release named by version.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  distribute-ref:
    # A dispatch runs the dispatched ref's workflow and publisher, so the
    # Cloudflare secret is only exposed to distribute-only runs from main.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute_only && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject distribute-only dispatch outside main
        run: |
          echo "::error::distribute_only dispatches must run from refs/heads/main, not $GITHUB_REF"
          exit 1

  codeql-release:
    name: CodeQL release gate
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/codeql.yml
    with:
      profile: full
    permissions:
      actions: read
      contents: read
      security-events: write

  required-ci-attestation:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify Required CI authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-required-ci.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" > required-ci-attestation.json
      - name: Upload Required CI attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-ci-attestation
          path: required-ci-attestation.json
          if-no-files-found: error
          retention-days: 90

  salesforce-authority:
    if: ${{ !inputs.distribute_only }}
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Salesforce release authority
        env:
          GH_TOKEN: ${{ github.token }}
          GLADE_TOOLS_SHA: ${{ inputs.glade_tools_sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            glade_tools_sha="$(scripts/verify-salesforce-check.sh --tag-tools-sha "$GITHUB_REF_NAME")"
          else
            glade_tools_sha="$GLADE_TOOLS_SHA"
          fi
          scripts/verify-salesforce-check.sh "$GITHUB_SHA" "$glade_tools_sha" > salesforce-release-authority.json
      - name: Upload Salesforce release authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: salesforce-release-authority
          path: salesforce-release-authority.json
          if-no-files-found: error
          retention-days: 90

  prepare:
    needs: [required-ci-attestation, salesforce-authority, codeql-release]
    if: startsWith(github.ref, 'refs/tags/') && needs.required-ci-attestation.result == 'success' && needs.salesforce-authority.result == 'success' && needs.codeql-release.result == 'success'
    # Serialize draft edits with publication for this tag.
    concurrency: release-metadata-${{ github.ref }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODEQL_COMPLETED: ${{ needs.codeql-release.outputs.completed }}
        run: |
          warning='Note: the full CodeQL scan for this release did not complete within its time limit.'
          notes_with_warning() {
            printf '%s\n\n' "$warning"
            cat "$1"
          }
          edit_draft_notes() {
            local draft
            # GitHub's release API has no atomic draft-only notes update. A
            # maintainer can still publish between this check and the edit.
            if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" && [[ "$draft" == true ]]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
          }

          expected_target="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if release="$(gh release view "$GITHUB_REF_NAME" --json isDraft,body 2>/dev/null)"; then
            release_draft="$(jq -r '.isDraft' <<< "$release")"
            if [[ "$release_draft" == true ]]; then
              jq -j '.body // ""' <<< "$release" > existing-release-notes.md
              if [[ "$CODEQL_COMPLETED" == false ]] && ! grep -Fxq -- "$warning" existing-release-notes.md; then
                notes_with_warning existing-release-notes.md > release-notes.md
                edit_draft_notes
              elif [[ "$CODEQL_COMPLETED" == true && "$(head -n 2 existing-release-notes.md)" == "$warning" ]]; then
                tail -n +3 existing-release-notes.md > release-notes.md
                edit_draft_notes
              fi
            fi
          else
            if [[ "$CODEQL_COMPLETED" == false ]] && ! grep -Fxq -- "$warning" release-notes.md; then
              notes_with_warning release-notes.md > release-notes-with-codeql-warning.md
              mv release-notes-with-codeql-warning.md release-notes.md
            fi
            gh release create "$GITHUB_REF_NAME" \
              --target "$expected_target" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          release_tag="$(gh release view "$GITHUB_REF_NAME" --json tagName --jq .tagName)"
          test "$release_tag" = "$GITHUB_REF_NAME"
          test "$(git rev-list -n 1 "$release_tag")" = "$expected_target"

  shared-payload:
    needs: [required-ci-attestation, salesforce-authority, codeql-release, prepare]
    if: always() && (needs.codeql-release.result == 'success' || needs.codeql-release.result == 'skipped' && !startsWith(github.ref, 'refs/tags/')) && needs.salesforce-authority.result == 'success' && (needs.required-ci-attestation.result == 'success' || needs.required-ci-attestation.result == 'skipped') && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Resolve npm cache path
        id: npm-cache
        shell: bash
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore release npm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: release-v1-npm-${{ runner.os }}-22-${{ hashFiles('third_party/lwc/package-lock.json', 'contrib/vscode-glade/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-v1-npm-${{ runner.os }}-22-${{ hashFiles('third_party/lwc/package-lock.json', 'contrib/vscode-glade/package-lock.json') }}-
      - name: Install extension test dependencies
        working-directory: contrib/vscode-glade
        run: npm ci
      - name: Test extension behavior
        working-directory: contrib/vscode-glade
        run: npm test
      - name: Build shared release payload
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: scripts/release-build.sh shared-payload
      - name: Upload shared release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glade-release-shared-payload
          path: |
            dist/glade-shared-payload.tar.gz
            dist/glade-shared-payload.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, shared-payload]
    if: always() && needs.shared-payload.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            artifact: linux-amd64
            archive: linux_amd64
          - runs-on: ubuntu-24.04-arm
            artifact: linux-arm64
            archive: linux_arm64
          - runs-on: macos-15-intel
            artifact: darwin-amd64
            archive: darwin_amd64
          - runs-on: macos-15
            artifact: darwin-arm64
            archive: darwin_arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Resolve Go cache paths
        id: go-cache-paths
        shell: bash
        run: |
          echo "gomod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gobuild=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore release Go caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.gomod }}
            ${{ steps.go-cache-paths.outputs.gobuild }}
          key: release-v1-go-${{ runner.os }}-${{ matrix.archive }}-1.27.4-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            release-v1-go-${{ runner.os }}-${{ matrix.archive }}-1.27.4-${{ hashFiles('go.sum') }}-
      - name: Download shared release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glade-release-shared-payload
          path: ${{ runner.temp }}/glade-release-shared
      - name: Verify shared release payload
        shell: bash
        run: |
          shared_dir="${RUNNER_TEMP}/glade-release-shared"
          expected="$(awk 'NR == 1 {print $1}' "${shared_dir}/glade-shared-payload.tar.gz.sha256")"
          actual="$(shasum -a 256 "${shared_dir}/glade-shared-payload.tar.gz" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
      - name: Build platform release artifacts
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RELEASE_SHARED_PAYLOAD_ARCHIVE: ${{ runner.temp }}/glade-release-shared/glade-shared-payload.tar.gz
          RELEASE_SHARED_PAYLOAD_SHA256: ${{ runner.temp }}/glade-release-shared/glade-shared-payload.tar.gz.sha256
        run: scripts/release-build.sh platform
      - name: Restore CycloneDX tool
        id: cyclonedx-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/cyclonedx-bin
          key: release-v1-cyclonedx-${{ runner.os }}-${{ matrix.archive }}-v1.10.0
      - name: Install CycloneDX tool
        if: steps.cyclonedx-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/cyclonedx-bin
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Generate CycloneDX SBOM
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          archive="dist/glade_${VERSION}_${{ matrix.archive }}.tar.gz"
          sbom="${archive}.sbom.json"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir" glade
          export PATH="${{ runner.temp }}/cyclonedx-bin:$PATH"
          cyclonedx-gomod bin -json -version "$VERSION" -output "$sbom" "$extract_dir/glade"
          python3 scripts/release-bundle.py sbom "$archive" "$sbom"
          test -s "$sbom"
          python3 - "$sbom" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              document = json.load(f)
          if not isinstance(document, dict) or not document:
              raise SystemExit("empty CycloneDX document")
          PY
      - name: Upload platform workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glade-release-platform-${{ matrix.artifact }}
          path: |
            dist/glade_*
            dist/release-manifest-${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 7

  attest-and-upload:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-amd64
            archive: linux_amd64
          - artifact: linux-arm64
            archive: linux_arm64
          - artifact: darwin-amd64
            archive: darwin_amd64
          - artifact: darwin-arm64
            archive: darwin_arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download platform workflow artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glade-release-platform-${{ matrix.artifact }}
          path: dist
      - name: Attest platform archive
        id: attest-archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz
      - name: Attest platform SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz
          sbom-path: dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz.sbom.json
      - name: Verify platform attestations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          ARCHIVE_BUNDLE: ${{ steps.attest-archive.outputs.bundle-path }}
        run: |
          archive="dist/glade_${VERSION}_${{ matrix.archive }}.tar.gz"
          gh attestation verify "$archive" -R "$GITHUB_REPOSITORY"
          gh attestation verify "$archive" -R "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom

          bundle="${archive}.sigstore.json"
          existing_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          # A retry can produce a fresh signature for the same archive. Reuse
          # the original asset bytes only after verifying them below.
          if grep -Fxq -- "${bundle##*/}" <<<"$existing_assets"; then
            gh release download "$GITHUB_REF_NAME" --pattern "${bundle##*/}" --output "$bundle"
          else
            cp -- "$ARCHIVE_BUNDLE" "$bundle"
          fi
          gh attestation verify "$archive" --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF"
      - name: Upload platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/release-asset-upload.sh "$GITHUB_REF_NAME" \
            dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz \
            dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz.sha256 \
            dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz.sbom.json \
            dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz.sigstore.json \
            dist/release-manifest-${{ matrix.artifact }}.json

  publish:
    needs: attest-and-upload
    if: startsWith(github.ref, 'refs/tags/')
    concurrency: release-metadata-${{ github.ref }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -rf dist
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --dir dist \
            --pattern 'glade_*.tar.gz' \
            --pattern 'glade_*.tar.gz.sha256' \
            --pattern 'glade_*.tar.gz.sbom.json' \
            --pattern 'release-manifest-*.json' \
            --clobber
      - name: Download Required CI approval
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: required-ci-attestation
          path: dist
      - name: Download Salesforce approval
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: salesforce-release-authority
          path: dist
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Assemble checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          python3 <<'PY'
          import glob
          import json
          import os
          import shutil

          version = os.environ["VERSION"]
          with open("required-ci-attestation.json", encoding="utf-8") as f:
              required_ci = json.load(f)
          with open("salesforce-release-authority.json", encoding="utf-8") as f:
              salesforce = json.load(f)
          if required_ci["sha"] != os.environ["GITHUB_SHA"] or salesforce["gladeSHA"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("release approval SHA mismatch")
          if required_ci["conclusion"] != "success":
              raise SystemExit("Required CI approval is not successful")
          manifests = []
          for path in sorted(glob.glob("release-manifest-*.json")):
              with open(path, "r", encoding="utf-8") as f:
                  manifests.append(json.load(f))
          if not manifests:
              raise SystemExit("no platform manifests found")

          assets = []
          verification = []
          for manifest in manifests:
              assets.extend(manifest.get("assets", []))
              if "verification" in manifest:
                  verification.append(manifest["verification"])

          combined = {
              "schemaVersion": 2,
              "channel": "stable",
              "version": version,
              "assets": assets,
              "installScript": "https://glade.sh/install.sh",
              "pluginRegistry": "https://plugins.glade.sh/index.json",
              "verification": verification,
              "authority": {"requiredCI": required_ci, "salesforce": salesforce},
          }
          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(combined, f, indent=2, sort_keys=True)
              f.write("\n")

          os.makedirs("latest", exist_ok=True)
          shutil.copyfile("release-manifest.json", "latest/release-manifest.json")
          os.makedirs(version, exist_ok=True)
          shutil.copyfile("release-manifest.json", os.path.join(version, "release-manifest.json"))
          for path in glob.glob("glade_*"):
              if os.path.isfile(path):
                  shutil.copyfile(path, os.path.join(version, os.path.basename(path)))
          shutil.copyfile("SHA256SUMS.txt", os.path.join(version, "SHA256SUMS.txt"))
          for approval in ("required-ci-attestation.json", "salesforce-release-authority.json"):
              shutil.copyfile(approval, os.path.join(version, approval))
          PY
          python3 ../scripts/release-index.py --version "$VERSION" --output index.json
          bundle="glade-release-artifacts-$VERSION.tar.gz"
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$bundle"; then
            gh release download "$GITHUB_REF_NAME" --pattern "$bundle" --output "../$bundle"
          fi
          python3 ../scripts/release-bundle.py . "../$bundle"
          mv "../$bundle" .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          scripts/release-asset-upload.sh "$GITHUB_REF_NAME" \
            dist/SHA256SUMS.txt \
            dist/index.json \
            dist/release-manifest.json \
            dist/required-ci-attestation.json \
            dist/salesforce-release-authority.json \
            dist/glade-release-artifacts-$VERSION.tar.gz
      - name: Verify complete release asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          expected_assets="$(printf '%s\n' \
            "SHA256SUMS.txt" \
            "glade-release-artifacts-$GITHUB_REF_NAME.tar.gz" \
            "glade_${GITHUB_REF_NAME}_darwin_amd64.tar.gz" \
            "glade_${GITHUB_REF_NAME}_darwin_amd64.tar.gz.sbom.json" \
            "glade_${GITHUB_REF_NAME}_darwin_amd64.tar.gz.sha256" \
            "glade_${GITHUB_REF_NAME}_darwin_amd64.tar.gz.sigstore.json" \
            "glade_${GITHUB_REF_NAME}_darwin_arm64.tar.gz" \
            "glade_${GITHUB_REF_NAME}_darwin_arm64.tar.gz.sbom.json" \
            "glade_${GITHUB_REF_NAME}_darwin_arm64.tar.gz.sha256" \
            "glade_${GITHUB_REF_NAME}_darwin_arm64.tar.gz.sigstore.json" \
            "glade_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
            "glade_${GITHUB_REF_NAME}_linux_amd64.tar.gz.sbom.json" \
            "glade_${GITHUB_REF_NAME}_linux_amd64.tar.gz.sha256" \
            "glade_${GITHUB_REF_NAME}_linux_amd64.tar.gz.sigstore.json" \
            "glade_${GITHUB_REF_NAME}_linux_arm64.tar.gz" \
            "glade_${GITHUB_REF_NAME}_linux_arm64.tar.gz.sbom.json" \
            "glade_${GITHUB_REF_NAME}_linux_arm64.tar.gz.sha256" \
            "glade_${GITHUB_REF_NAME}_linux_arm64.tar.gz.sigstore.json" \
            "index.json" \
            "required-ci-attestation.json" \
            "salesforce-release-authority.json" \
            "release-manifest-darwin-amd64.json" \
            "release-manifest-darwin-arm64.json" \
            "release-manifest-linux-amd64.json" \
            "release-manifest-linux-arm64.json" \
            "release-manifest.json" | LC_ALL=C sort)"
          actual_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          test "$actual_assets" = "$expected_assets"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
          if [[ "$release_draft" == true ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          elif [[ "$release_draft" != false ]]; then
            echo "unexpected release draft state: $release_draft" >&2
            exit 1
          else
            echo "Release $GITHUB_REF_NAME already published; immutable release requires no mutation"
          fi

  distribute:
    needs: publish
    if: ${{ always() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success' || github.event_name == 'workflow_dispatch' && inputs.distribute_only && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: read
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Require static publisher credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set; add it, then rerun this job or dispatch distribute_only for $VERSION"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is not set"
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GLADE_TOOLS_SHA: ${{ inputs.glade_tools_sha }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::static distribution requires a stable vX.Y.Z version, got '$VERSION'"
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$VERSION")" = tag
          glade_sha="$(git rev-parse "refs/tags/$VERSION^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$glade_sha" = "$GITHUB_SHA"
          else
            test "$GITHUB_REF" = refs/heads/main
            tag_tools_sha="$(scripts/verify-salesforce-check.sh --tag-tools-sha "$VERSION")"
            if [[ "$GLADE_TOOLS_SHA" != "$tag_tools_sha" ]]; then
              echo "::error::glade_tools_sha differs from the Glade-Tools-SHA trailer of tag $VERSION"
              exit 1
            fi
          fi
          release_tag="$(gh release view "$VERSION" --json tagName --jq .tagName)"
          test "$release_tag" = "$VERSION"
          release_draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft)"
          if [[ "$release_draft" != false ]]; then
            echo "::error::GitHub Release $VERSION is not published; static distribution follows GitHub publication"
            exit 1
          fi
          echo "GLADE_SHA=$glade_sha" >> "$GITHUB_ENV"
      - name: Download and verify release bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bundle="glade-release-artifacts-$VERSION.tar.gz"
          assets="$RUNNER_TEMP/release-assets"
          rm -rf dist "$assets"
          mkdir -p dist "$assets"
          gh release download "$VERSION" --dir "$assets" \
            --pattern "$bundle" \
            --pattern SHA256SUMS.txt \
            --pattern index.json \
            --pattern release-manifest.json \
            --pattern required-ci-attestation.json \
            --pattern salesforce-release-authority.json
          tar --no-same-owner --no-same-permissions -C dist -xzf "$assets/$bundle"
          for name in SHA256SUMS.txt release-manifest.json required-ci-attestation.json salesforce-release-authority.json; do
            cmp "$assets/$name" "dist/$VERSION/$name"
          done
          cmp "$assets/index.json" dist/index.json
          cmp "$assets/release-manifest.json" dist/latest/release-manifest.json
          (cd "dist/$VERSION" && sha256sum --check --strict SHA256SUMS.txt)
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive="glade_${VERSION}_${platform}.tar.gz"
            (cd "dist/$VERSION" && sha256sum --check --strict "$archive.sha256")
            gh attestation verify "dist/$VERSION/$archive" \
              --repo glade-sh/glade \
              --signer-workflow glade-sh/glade/.github/workflows/release.yml \
              --source-digest "$GLADE_SHA" \
              --source-ref "refs/tags/$VERSION"
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install pinned static publisher
        run: npm ci --prefix scripts --ignore-scripts
      - name: Publish static downloads
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_MODULE: ${{ github.workspace }}/scripts/node_modules/wrangler
        run: node scripts/release-publish.mjs dist "$VERSION" "$GLADE_SHA"
      - name: Verify public downloads
        shell: bash
        run: |
          public="$RUNNER_TEMP/public-downloads"
          rm -rf "$public"
          mkdir -p "$public"
          fetch() {
            curl --proto '=https' --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 "$1" --output "$2"
          }
          fetch https://downloads.glade.sh/latest/release-manifest.json "$public/latest-release-manifest.json"
          test "$(jq -er .version "$public/latest-release-manifest.json")" = "$VERSION"
          cmp dist/latest/release-manifest.json "$public/latest-release-manifest.json"
          fetch "https://downloads.glade.sh/$VERSION/release-manifest.json" "$public/release-manifest.json"
          cmp "dist/$VERSION/release-manifest.json" "$public/release-manifest.json"
          fetch https://downloads.glade.sh/index.json "$public/index.json"
          jq -e --arg version "$VERSION" '.latest == $version and any(.versions[]; .version == $version)' "$public/index.json" >/dev/null
          jq -er '.assets[].url' "dist/$VERSION/release-manifest.json" | while IFS= read -r url; do
            curl --proto '=https' --fail --silent --show-error --head --location \
              --retry 5 --retry-all-errors --retry-delay 2 "$url" >/dev/null
          done
      - name: Redeploy site
        shell: bash
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [[ -z "$CF_PAGES_DEPLOY_HOOK" ]]; then
            echo "::error::Repository secret CF_PAGES_DEPLOY_HOOK is not set; add the glade-site Pages deploy hook, then rerun this job or dispatch distribute_only for $VERSION"
            exit 1
          fi
          curl --proto '=https' --fail --silent --show-error --output /dev/null \
            --max-time 60 --retry 5 --retry-all-errors --retry-delay 5 \
            --request POST "$CF_PAGES_DEPLOY_HOOK"
          echo "Requested a glade-site Pages deployment of main"
      - name: Wait for site release version
        shell: bash
        run: |
          site_build="$RUNNER_TEMP/site-build.json"
          wait_seconds=900
          poll_seconds=20
          deadline=$((SECONDS + wait_seconds))
          while :; do
            if curl --proto '=https' --fail --silent --show-error --max-time 30 \
                --retry 3 --retry-all-errors --retry-delay 5 \
                https://glade.sh/site-build.json --output "$site_build" &&
              [[ "$(jq -r '.releaseVersion // empty' "$site_build")" == "$VERSION" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::glade.sh/site-build.json did not report $VERSION within $wait_seconds seconds"
              exit 1
            fi
            sleep "$poll_seconds"
          done
          site_commit="$(jq -er .siteCommit "$site_build")"
          if [[ ! "$site_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::glade.sh/site-build.json siteCommit is not a full commit SHA: $site_commit"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$site_commit" refs/remotes/origin/main; then
            echo "::error::deployed site commit $site_commit is not reachable from main"
            exit 1
          fi
          # The smoke checks the deployed routes, so run it from the deployed commit.
          git worktree add --detach "$RUNNER_TEMP/deployed-site" "$site_commit"
          echo "SITE_COMMIT=$site_commit" >> "$GITHUB_ENV"
      - name: Install site smoke dependencies
        run: npm ci --prefix "$RUNNER_TEMP/deployed-site/site" --ignore-scripts
      - name: Install Playwright Chromium
        working-directory: ${{ runner.temp }}/deployed-site/site
        run: ../scripts/ci-install-playwright.sh npx playwright install chromium
      - name: Smoke-test the deployed site
        working-directory: ${{ runner.temp }}/deployed-site/site
        run: npm run smoke:postdeploy -- --base-url https://glade.sh --expected-commit "$SITE_COMMIT"
