name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for artifact names.
        required: false
        default: dev

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  build:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            artifact: linux-amd64
          - runs-on: ubuntu-24.04-arm
            artifact: linux-arm64
          - runs-on: macos-15-intel
            artifact: darwin-amd64
          - runs-on: macos-14
            artifact: darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: scripts/release-build.sh
      - name: Generate CycloneDX SBOM
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          archive="dist/glade_${VERSION}_${{ matrix.artifact }}.tar.gz"
          sbom="${archive}.sbom.json"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir" glade
          cyclonedx-gomod bin -json -version "$VERSION" -output "$sbom" "$extract_dir/glade"
      - name: Attest platform archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: dist/glade_${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}_${{ matrix.artifact }}.tar.gz
      - name: Attest platform SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: dist/glade_${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}_${{ matrix.artifact }}.tar.gz
          sbom-path: dist/glade_${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}_${{ matrix.artifact }}.tar.gz.sbom.json
      - name: Upload platform release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/glade_* \
            dist/release-manifest-${{ matrix.artifact }}.json \
            --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -rf dist
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --dir dist \
            --pattern 'glade_*' \
            --pattern 'release-manifest-*.json' \
            --clobber
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Assemble checksums
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          python3 <<'PY'
          import glob
          import json
          import os
          import shutil

          version = os.environ["VERSION"]
          manifests = []
          for path in sorted(glob.glob("release-manifest-*.json")):
              with open(path, "r", encoding="utf-8") as f:
                  manifests.append(json.load(f))
          if not manifests:
              raise SystemExit("no platform manifests found")

          assets = []
          verification = []
          for manifest in manifests:
              assets.extend(manifest.get("assets", []))
              if "verification" in manifest:
                  verification.append(manifest["verification"])

          combined = {
              "schemaVersion": 2,
              "channel": "stable",
              "version": version,
              "assets": assets,
              "installScript": "https://glade.sh/install.sh",
              "pluginRegistry": "https://plugins.glade.sh/index.json",
              "verification": verification,
          }
          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(combined, f, indent=2, sort_keys=True)
              f.write("\n")

          os.makedirs("latest", exist_ok=True)
          shutil.copyfile("release-manifest.json", "latest/release-manifest.json")
          os.makedirs(version, exist_ok=True)
          shutil.copyfile("release-manifest.json", os.path.join(version, "release-manifest.json"))
          for path in glob.glob("glade_*"):
              if os.path.isfile(path):
                  shutil.copyfile(path, os.path.join(version, os.path.basename(path)))
          shutil.copyfile("SHA256SUMS.txt", os.path.join(version, "SHA256SUMS.txt"))
          PY
          python3 ../scripts/release-index.py --version "$VERSION" --output index.json
          bundle="glade-release-artifacts-$VERSION.tar.gz"
          tar -C . -czf "../$bundle" .
          mv "../$bundle" .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files="$(find dist -maxdepth 1 -type f -print)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
