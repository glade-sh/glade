name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for artifact names.
        required: false
        default: dev
      glade_tools_sha:
        description: Full lowercase 40-hex glade-tools commit with Salesforce authority.
        required: true
        type: string

permissions:
  contents: read

jobs:
  required-ci-attestation:
    needs: salesforce-authority
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify Required CI authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-required-ci.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" > required-ci-attestation.json
      - name: Upload Required CI attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-ci-attestation
          path: required-ci-attestation.json
          if-no-files-found: error
          retention-days: 90

  salesforce-authority:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Salesforce release authority
        env:
          GH_TOKEN: ${{ github.token }}
          GLADE_TOOLS_SHA: ${{ inputs.glade_tools_sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            glade_tools_sha="$(scripts/verify-salesforce-check.sh --tag-tools-sha "$GITHUB_REF_NAME")"
          else
            glade_tools_sha="$GLADE_TOOLS_SHA"
          fi
          scripts/verify-salesforce-check.sh "$GITHUB_SHA" "$glade_tools_sha" > salesforce-release-authority.json
      - name: Upload Salesforce release authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: salesforce-release-authority
          path: salesforce-release-authority.json
          if-no-files-found: error
          retention-days: 90

  prepare:
    needs: required-ci-attestation
    if: startsWith(github.ref, 'refs/tags/') && needs.required-ci-attestation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it without mutation"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  shared-payload:
    needs: [required-ci-attestation, salesforce-authority, prepare]
    if: always() && needs.salesforce-authority.result == 'success' && (needs.required-ci-attestation.result == 'success' || needs.required-ci-attestation.result == 'skipped') && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Resolve npm cache path
        id: npm-cache
        shell: bash
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore release npm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: release-v1-npm-${{ runner.os }}-22-${{ hashFiles('third_party/lwc/package-lock.json', 'contrib/vscode-glade/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-v1-npm-${{ runner.os }}-22-${{ hashFiles('third_party/lwc/package-lock.json', 'contrib/vscode-glade/package-lock.json') }}-
      - name: Build shared release payload
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: scripts/release-build.sh shared-payload
      - name: Upload shared release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glade-release-shared-payload
          path: |
            dist/glade-shared-payload.tar.gz
            dist/glade-shared-payload.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, shared-payload]
    if: always() && needs.shared-payload.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            artifact: linux-amd64
            archive: linux_amd64
          - runs-on: ubuntu-24.04-arm
            artifact: linux-arm64
            archive: linux_arm64
          - runs-on: macos-15-intel
            artifact: darwin-amd64
            archive: darwin_amd64
          - runs-on: macos-14
            artifact: darwin-arm64
            archive: darwin_arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Resolve Go cache paths
        id: go-cache-paths
        shell: bash
        run: |
          echo "gomod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gobuild=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore release Go caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.gomod }}
            ${{ steps.go-cache-paths.outputs.gobuild }}
          key: release-v1-go-${{ runner.os }}-${{ matrix.archive }}-1.26.6-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            release-v1-go-${{ runner.os }}-${{ matrix.archive }}-1.26.6-${{ hashFiles('go.sum') }}-
      - name: Download shared release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glade-release-shared-payload
          path: .release-shared
      - name: Verify shared release payload
        shell: bash
        run: |
          expected="$(awk 'NR == 1 {print $1}' .release-shared/glade-shared-payload.tar.gz.sha256)"
          actual="$(shasum -a 256 .release-shared/glade-shared-payload.tar.gz | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
      - name: Build platform release artifacts
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RELEASE_SHARED_PAYLOAD_ARCHIVE: ${{ github.workspace }}/.release-shared/glade-shared-payload.tar.gz
          RELEASE_SHARED_PAYLOAD_SHA256: ${{ github.workspace }}/.release-shared/glade-shared-payload.tar.gz.sha256
        run: scripts/release-build.sh platform
      - name: Restore CycloneDX tool
        id: cyclonedx-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/cyclonedx-bin
          key: release-v1-cyclonedx-${{ runner.os }}-${{ matrix.archive }}-v1.10.0
      - name: Install CycloneDX tool
        if: steps.cyclonedx-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/cyclonedx-bin
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Generate CycloneDX SBOM
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          archive="dist/glade_${VERSION}_${{ matrix.archive }}.tar.gz"
          sbom="${archive}.sbom.json"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir" glade
          export PATH="${{ runner.temp }}/cyclonedx-bin:$PATH"
          cyclonedx-gomod bin -json -version "$VERSION" -output "$sbom" "$extract_dir/glade"
          test -s "$sbom"
          python3 - "$sbom" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              document = json.load(f)
          if not isinstance(document, dict) or not document:
              raise SystemExit("empty CycloneDX document")
          PY
      - name: Upload platform workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glade-release-platform-${{ matrix.artifact }}
          path: |
            dist/glade_*
            dist/release-manifest-${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 7

  attest-and-upload:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-amd64
            archive: linux_amd64
          - artifact: linux-arm64
            archive: linux_arm64
          - artifact: darwin-amd64
            archive: darwin_amd64
          - artifact: darwin-arm64
            archive: darwin_arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download platform workflow artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glade-release-platform-${{ matrix.artifact }}
          path: dist
      - name: Attest platform archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz
      - name: Attest platform SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz
          sbom-path: dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz.sbom.json
      - name: Verify platform attestations
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          archive="dist/glade_${VERSION}_${{ matrix.archive }}.tar.gz"
          gh attestation verify "$archive" -R "$GITHUB_REPOSITORY"
          gh attestation verify "$archive" -R "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom
      - name: Upload platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz \
            dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz.sha256 \
            dist/glade_${{ github.ref_name }}_${{ matrix.archive }}.tar.gz.sbom.json \
            dist/release-manifest-${{ matrix.artifact }}.json

  publish:
    needs: attest-and-upload
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -rf dist
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --dir dist \
            --pattern 'glade_*' \
            --pattern 'release-manifest-*.json' \
            --clobber
      - name: Build release notes
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Assemble checksums
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          python3 <<'PY'
          import glob
          import json
          import os
          import shutil

          version = os.environ["VERSION"]
          manifests = []
          for path in sorted(glob.glob("release-manifest-*.json")):
              with open(path, "r", encoding="utf-8") as f:
                  manifests.append(json.load(f))
          if not manifests:
              raise SystemExit("no platform manifests found")

          assets = []
          verification = []
          for manifest in manifests:
              assets.extend(manifest.get("assets", []))
              if "verification" in manifest:
                  verification.append(manifest["verification"])

          combined = {
              "schemaVersion": 2,
              "channel": "stable",
              "version": version,
              "assets": assets,
              "installScript": "https://glade.sh/install.sh",
              "pluginRegistry": "https://plugins.glade.sh/index.json",
              "verification": verification,
          }
          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(combined, f, indent=2, sort_keys=True)
              f.write("\n")

          os.makedirs("latest", exist_ok=True)
          shutil.copyfile("release-manifest.json", "latest/release-manifest.json")
          os.makedirs(version, exist_ok=True)
          shutil.copyfile("release-manifest.json", os.path.join(version, "release-manifest.json"))
          for path in glob.glob("glade_*"):
              if os.path.isfile(path):
                  shutil.copyfile(path, os.path.join(version, os.path.basename(path)))
          shutil.copyfile("SHA256SUMS.txt", os.path.join(version, "SHA256SUMS.txt"))
          PY
          python3 ../scripts/release-index.py --version "$VERSION" --output index.json
          bundle="glade-release-artifacts-$VERSION.tar.gz"
          tar -C . -czf "../$bundle" .
          mv "../$bundle" .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/SHA256SUMS.txt \
            dist/index.json \
            dist/release-manifest.json \
            dist/glade-release-artifacts-$VERSION.tar.gz
