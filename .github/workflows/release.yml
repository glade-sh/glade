name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for artifact names.
        required: false
        default: dev

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            artifact: linux-amd64
          - runs-on: ubuntu-24.04-arm
            artifact: linux-arm64
          - runs-on: macos-15-intel
            artifact: darwin-amd64
          - runs-on: macos-14
            artifact: darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: scripts/release-build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: glade-release-${{ matrix.artifact }}
          path: |
            dist/glade_*
            dist/release-manifest-${{ matrix.artifact }}.json
            !dist/SHA256SUMS.txt
            !dist/release-manifest.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Assemble checksums
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          python3 <<'PY'
          import glob
          import json
          import os
          import shutil

          version = os.environ["VERSION"]
          manifests = []
          for path in sorted(glob.glob("release-manifest-*.json")):
              with open(path, "r", encoding="utf-8") as f:
                  manifests.append(json.load(f))
          if not manifests:
              raise SystemExit("no platform manifests found")

          assets = []
          verification = []
          for manifest in manifests:
              assets.extend(manifest.get("assets", []))
              if "verification" in manifest:
                  verification.append(manifest["verification"])

          combined = {
              "schemaVersion": 2,
              "channel": "stable",
              "version": version,
              "assets": assets,
              "installScript": "https://glade.sh/install.sh",
              "pluginRegistry": "https://plugins.glade.sh/index.json",
              "verification": verification,
          }
          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(combined, f, indent=2, sort_keys=True)
              f.write("\n")

          os.makedirs("latest", exist_ok=True)
          shutil.copyfile("release-manifest.json", "latest/release-manifest.json")
          os.makedirs(version, exist_ok=True)
          shutil.copyfile("release-manifest.json", os.path.join(version, "release-manifest.json"))
          for path in glob.glob("glade_*"):
              if os.path.isfile(path):
                  shutil.copyfile(path, os.path.join(version, os.path.basename(path)))
          shutil.copyfile("SHA256SUMS.txt", os.path.join(version, "SHA256SUMS.txt"))
          PY
          python3 ../scripts/release-index.py --version "$VERSION" --output index.json
      - uses: actions/upload-artifact@v7
        with:
          name: glade-release-artifacts
          path: dist/**
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files="$(find dist -maxdepth 1 -type f -print)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
