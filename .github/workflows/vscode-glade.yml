name: VS Code Extension

on:
  pull_request:
    paths:
      - ".github/workflows/vscode-glade.yml"
      - "contrib/vscode-glade/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vscode-glade.yml"
      - "contrib/vscode-glade/**"

permissions:
  contents: read

concurrency:
  group: vscode-glade-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrib/vscode-glade
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contrib/vscode-glade/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
