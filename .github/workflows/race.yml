name: Race

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.classify.outputs.packages }}
      non-apextest-packages: ${{ steps.classify.outputs.non-apextest-packages }}
      has-packages: ${{ steps.classify.outputs.has-packages }}
      has-non-apextest-packages: ${{ steps.classify.outputs.has-non-apextest-packages }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Classify race packages
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              mode=changed
              packages="$(scripts/ci-race-packages.sh changed "$BASE_SHA" "$HEAD_SHA")"
              ;;
            push)
              mode=high-risk
              packages="$(scripts/ci-race-packages.sh high-risk)"
              ;;
            schedule|workflow_dispatch)
              mode=full
              packages="$(scripts/ci-race-packages.sh full)"
              ;;
            *)
              echo "unsupported race event: ${{ github.event_name }}" >&2
              exit 2
              ;;
          esac
          if [[ "$packages" == "[]" ]]; then has_packages=false; else has_packages=true; fi
          non_apextest_packages="$(python3 - "$packages" <<'PY'
          import json
          import sys
          packages = json.loads(sys.argv[1])
          print(json.dumps([package for package in packages if package != "./internal/apextest"], separators=(",", ":")))
          PY
          )"
          if [[ "$non_apextest_packages" == "[]" ]]; then has_non_apextest_packages=false; else has_non_apextest_packages=true; fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "packages=$packages" >>"$GITHUB_OUTPUT"
          echo "non-apextest-packages=$non_apextest_packages" >>"$GITHUB_OUTPUT"
          echo "has-packages=$has_packages" >>"$GITHUB_OUTPUT"
          echo "has-non-apextest-packages=$has_non_apextest_packages" >>"$GITHUB_OUTPUT"
          mkdir -p ci-artifacts/race-plan
          printf '{"mode":"%s","packages":%s}\n' "$mode" "$packages" >ci-artifacts/race-plan/plan.json
      - name: Upload race plan
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: race-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/race-plan/plan.json
          if-no-files-found: error

  race:
    needs: plan
    if: needs.plan.outputs.has-non-apextest-packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.non-apextest-packages) }}
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ contains(fromJSON('["./internal/gladecli","./internal/gladehome","./internal/lwc/compile","./internal/lwcbrowser","./internal/server"]'), matrix.package) }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: third_party/lwc/package-lock.json
      - name: Install LWC toolchain
        if: ${{ contains(fromJSON('["./internal/gladecli","./internal/gladehome","./internal/lwc/compile","./internal/lwcbrowser","./internal/server"]'), matrix.package) }}
        run: npm ci --prefix third_party/lwc
      - name: Resolve artifact name
        id: artifact
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          slug="${PACKAGE#./}"
          slug="${slug//\//-}"
          if [[ ! "$slug" =~ ^[A-Za-z0-9._-]+$ ]]; then exit 2; fi
          echo "slug=$slug" >>"$GITHUB_OUTPUT"
      - name: Run race detector
        env:
          PACKAGE: ${{ matrix.package }}
          SLUG: ${{ steps.artifact.outputs.slug }}
        run: scripts/ci-race-test.sh "$PACKAGE" "$SLUG"
      - name: Upload race evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: race-${{ steps.artifact.outputs.slug }}
          path: ci-artifacts/race/
          if-no-files-found: error

  race-apextest-a:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), './internal/apextest')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GOMAXPROCS: "2"
      CI_RACE_APEXTEST_RUNNER: a
      CI_RACE_APEXTEST_SHARD_INDEXES: 0,1,2,3,4,5,6
      CI_RACE_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Run assigned Apex race shards
        run: scripts/ci-race-test.sh ./internal/apextest internal-apextest
      - name: Upload Apex runner A evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: race-internal-apextest-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/race/internal-apextest
          if-no-files-found: error

  race-apextest-b:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), './internal/apextest')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GOMAXPROCS: "2"
      CI_RACE_APEXTEST_RUNNER: b
      CI_RACE_APEXTEST_SHARD_INDEXES: 7
      CI_RACE_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Run assigned Apex race shard
        run: scripts/ci-race-test.sh ./internal/apextest internal-apextest
      - name: Upload Apex runner B evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: race-internal-apextest-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/race/internal-apextest
          if-no-files-found: error

  race-apextest-aggregate:
    needs: [plan, race-apextest-a, race-apextest-b]
    if: always() && contains(fromJSON(needs.plan.outputs.packages), './internal/apextest')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download Apex runner A evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: race-internal-apextest-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/race/apextest-a
      - name: Download Apex runner B evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: race-internal-apextest-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/race/apextest-b
      - name: Validate combined Apex race evidence
        run: scripts/ci-race-apextest-aggregate.sh ci-artifacts/race/apextest-a ci-artifacts/race/apextest-b ci-artifacts/race/apextest-aggregate/union-validation.json "${{ github.sha }}"
      - name: Upload combined Apex race evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: race-internal-apextest-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/race/apextest-aggregate/union-validation.json
          if-no-files-found: error
