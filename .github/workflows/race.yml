name: Race

# The race detector only reports races between goroutines that run at the
# same time, so the nightly set covers exactly that, plus a weekly full
# backstop. go test's exit status is the verdict: no plan job, no duration
# history, no shard evidence.
on:
  schedule:
    # Nightly lite Monday through Saturday; the Sunday slot below is the
    # weekly full backstop, which subsumes the nightly set.
    - cron: '43 10 * * 1-6'
    - cron: '43 10 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the weekly full backstop instead of the nightly set'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CGO_ENABLED: "1"
  GOMAXPROCS: "2"
  GOMEMLIMIT: "6GiB"

concurrency:
  group: race-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Every package outside the six big ones and outside the browser set, whole,
  # split into two halves so the race compile is shared. The packages whose
  # tests drive Node, the vendored LWC toolchain and Playwright (lwc,
  # lwcbrowser, lwcruntime) run in browser-packages below with those
  # prerequisites; repoguard is excluded here (its full suite runs in normal
  # CI and in the weekly backstop); its concurrency-bearing scan-cache unit
  # tests run in concurrent-tests below.
  small-packages:
    name: Small packages whole (half ${{ matrix.half }})
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 10 * * 1-6') || (github.event_name == 'workflow_dispatch' && !inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        half: [0, 1]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: false
      - name: Run race detector over the small packages
        run: |
          mapfile -t packages < <(go list ./... | grep -Ev \
            '^github\.com/glade-sh/glade/internal/(apextest|gladecli|gladehome|lwc|lwcbrowser|lwcruntime(/embed)?|playground|repoguard|sema|server|storage|testdaemon|vm|visualforce)$|^github\.com/glade-sh/glade/internal/lwc/compile$' \
            | awk -v half='${{ matrix.half }}' 'NR % 2 == half')
          echo "half ${{ matrix.half }}: ${#packages[@]} packages"
          go test -race -timeout=50m "${packages[@]}"
      - name: Summary
        if: always()
        run: 'echo "small packages, half ${{ matrix.half }}: ${{ job.status }}"'

  # The packages whose tests drive Node, the vendored LWC toolchain and
  # Playwright, whole: the LWC compiler routes of internal/lwc fail without
  # node and third_party/lwc/node_modules, the Playwright suites of
  # internal/lwcbrowser skip or fail without them plus the lwcruntime
  # dependencies and Chromium, and internal/lwcruntime runs the lwcruntime
  # npm test suite under GLADE_LWC_BROWSER=1. The install steps are the same
  # as weekly-browser's; the timeout covers those steps' 5+5+65 minute caps
  # plus the 60m per-package test budget the old nightly gave each of these.
  browser-packages:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 10 * * 1-6') || (github.event_name == 'workflow_dispatch' && !inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    env:
      GLADE_ROOT: ${{ github.workspace }}
      GLADE_LWC_PLAYWRIGHT_MODULE: ${{ github.workspace }}/lwcruntime/node_modules/playwright
      GLADE_LWC_BROWSER: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install LWC toolchain
        timeout-minutes: 5
        run: npm ci --prefix third_party/lwc
      - name: Install browser conformance dependencies
        timeout-minutes: 5
        run: npm ci --prefix lwcruntime
      # Three times the observed 19m39s install plus backoff fits in 65m.
      - name: Install conformance Chromium
        timeout-minutes: 65
        run: scripts/ci-install-playwright.sh ./lwcruntime/node_modules/.bin/playwright install --with-deps chromium
      - name: Run race detector over the browser packages
        run: go test -race -timeout=60m ./internal/lwc ./internal/lwcbrowser ./internal/lwcruntime
      - name: Summary
        if: always()
        run: 'echo "browser packages whole: ${{ job.status }}"'

  # The packages outside the big six that deliberately run concurrent code,
  # whole: storage, sema, gladehome, playground and testdaemon.
  concurrent-packages:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 10 * * 1-6') || (github.event_name == 'workflow_dispatch' && !inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GLADE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install LWC toolchain
        timeout-minutes: 5
        run: npm ci --prefix third_party/lwc
      - name: Run race detector over the concurrency-bearing packages
        run: go test -race -timeout=70m ./internal/storage ./internal/sema ./internal/gladehome ./internal/playground ./internal/testdaemon
      - name: Summary
        if: always()
        run: 'echo "concurrency packages whole: ${{ job.status }}"'

  # Only the tests whose names mark Go-level concurrency, one -run regex per
  # package. In apextest and vm the words Async, Queue, Stream, Signal and
  # Lock name Apex features (Queueable, @future, EventBus streams, Approval
  # and FOR UPDATE locks) — around a hundred heavy conformance tests under
  # one shared regex — and in server Serve matched the ServerRoutes HTTP
  # route tests, so those three packages keep only the words whose matches
  # there are Go concurrency: vm drops Worker and Overlap, whose only matches
  # are the BatchApexWorker job records and the trigger overlap error, and
  # server narrows Lock to OrgLock to keep the Approval.lock route tests
  # out. gladecli keeps the broad set because its Daemon, Watch,
  # GracefulStop, Listener and Serve tests are Go-level and light. Each
  # selection prints its matched-test count and fails on an empty match so
  # drift is visible, and keeps its per-package timeout. The lwc/compile and
  # visualforce entries are their nightly smoke; browser conformance is
  # excluded under race (the weekly backstop runs it). The lwc/compile smoke
  # compiles with the vendored LWC toolchain and the gladecli selection
  # synthesizes its own toolchain layout, so Node and the toolchain are
  # installed here. No regex-matched test drives Playwright — the only
  # browser suite in these packages is server's L08 conformance, which the
  # regexes do not match and GLADE_LWC_BROWSER=1 gates — so the lwcruntime
  # dependencies and Chromium stay out of this job.
  concurrent-tests:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 10 * * 1-6') || (github.event_name == 'workflow_dispatch' && !inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GLADE_ROOT: ${{ github.workspace }}
      # Go-concurrency words only, one regex per narrowed package (see the
      # job comment above).
      APEXTEST_CONCURRENCY_TEST_RE: 'Concurren|Parallel|Race|Goroutine|Worker|Pool|Singleflight|Overlap|Cancel'
      VM_CONCURRENCY_TEST_RE: 'Concurren|Race|Pool|Cancel'
      SERVER_CONCURRENCY_TEST_RE: 'Concurren|OrgLock|Listener|Shutdown|Graceful|Parallel|Race'
      # The broad set: gladecli's selection and the lwc/compile and
      # visualforce nightly smoke.
      CONCURRENCY_TEST_RE: 'Concurren|Parallel|Race|Goroutine|Cancel|Daemon|Watch|Async|Queue|Listener|Lock|Shutdown|GracefulStop|Interrupt|Pool|Worker|Serve|Stream|Heartbeat|Debounce|Singleflight|Reentrant|ThreadSafe|Overlap|Signal'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install LWC toolchain
        timeout-minutes: 5
        run: npm ci --prefix third_party/lwc
      - name: Run concurrency-named tests per package
        run: |
          run_selection() {
            package="$1" regex="$2" timeout="$3"
            listed="$(go test -race -list "$regex" "$package")"
            matched="$(printf '%s\n' "$listed" | grep -c '^Test' || true)"
            if [ "$matched" -eq 0 ]; then
              echo "$package: no tests match '$regex'" >&2
              exit 1
            fi
            echo "$package: $matched tests match '$regex'"
            go test -race -timeout="$timeout" -run "$regex" "$package"
          }
          run_selection ./internal/apextest "$APEXTEST_CONCURRENCY_TEST_RE" 25m
          run_selection ./internal/vm "$VM_CONCURRENCY_TEST_RE" 25m
          run_selection ./internal/gladecli "$CONCURRENCY_TEST_RE" 25m
          run_selection ./internal/server "$SERVER_CONCURRENCY_TEST_RE" 25m
          run_selection ./internal/lwc/compile "$CONCURRENCY_TEST_RE" 10m
          run_selection ./internal/visualforce "$CONCURRENCY_TEST_RE" 10m
          run_selection ./internal/repoguard '^TestPublicScan' 10m
      - name: Summary
        if: always()
        run: 'echo "concurrency-named tests of the big six plus the repoguard cache tests: ${{ job.status }}"'

  # A fixed sample of apextest and vm chosen by name hash, so shared package
  # state between parallel conformance subtests stays under the detector (the
  # shape the dml activity-refresh race had). scripts/ci-race-sample.py
  # derives the selection at run time from go test -list, the packages'
  # checked-in normal durations and their own t.Parallel() tests.
  conformance-sample:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 10 * * 1-6') || (github.event_name == 'workflow_dispatch' && !inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: false
      - name: Run the sampled apextest conformance tests
        run: |
          regex="$(go test -race -list '^Test' ./internal/apextest | python3 scripts/ci-race-sample.py internal/apextest/testdata/shard_durations.json internal/apextest --parallel)"
          echo "apextest sample: $regex"
          go test -race -timeout=40m -run "$regex" ./internal/apextest
      - name: Run the sampled vm conformance tests
        run: |
          regex="$(go test -race -list '^Test' ./internal/vm | python3 scripts/ci-race-sample.py internal/vm/testdata/shard_durations.json internal/vm)"
          echo "vm sample: $regex"
          go test -race -timeout=40m -run "$regex" ./internal/vm
      - name: Summary
        if: always()
        run: 'echo "1-in-25 conformance sample of apextest and vm: ${{ job.status }}"'

  # Weekly full backstop: one job per big package, whole, no sharding. If a
  # package outgrows the job timeout, split it by test-name initial
  # (-run '^Test[A-L]' and -run '^Test[M-Z]') instead of adding scheduling.
  weekly-big:
    name: Weekly full race (${{ matrix.package }})
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 10 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        package: ['./internal/apextest', './internal/vm', './internal/gladecli', './internal/server']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: false
      - name: Run the full package under the race detector
        run: go test -race -timeout=320m ${{ matrix.package }}
      - name: Summary
        if: always()
        run: 'echo "weekly full race, ${{ matrix.package }}: ${{ job.status }}"'

  weekly-browser:
    name: Weekly full race (${{ matrix.package }})
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 10 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        package: ['./internal/lwc/compile', './internal/visualforce']
    env:
      GLADE_ROOT: ${{ github.workspace }}
      GLADE_LWC_PLAYWRIGHT_MODULE: ${{ github.workspace }}/lwcruntime/node_modules/playwright
      GLADE_LWC_COMPILE: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install LWC toolchain
        if: ${{ matrix.package == './internal/lwc/compile' }}
        timeout-minutes: 5
        run: npm ci --prefix third_party/lwc
      - name: Install browser conformance dependencies
        timeout-minutes: 5
        run: npm ci --prefix lwcruntime
      # Three times the observed 19m39s install plus backoff fits in 65m.
      - name: Install conformance Chromium
        timeout-minutes: 65
        run: scripts/ci-install-playwright.sh ./lwcruntime/node_modules/.bin/playwright install --with-deps chromium
      - name: Run the full package under the race detector
        run: go test -race -timeout=320m ${{ matrix.package }}
      - name: Summary
        if: always()
        run: 'echo "weekly full race, ${{ matrix.package }}: ${{ job.status }}"'

  # The weekly rest: every package outside the big six in one job, including
  # repoguard, the concurrency packages and the small browser packages with
  # their full prerequisites.
  weekly-rest:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 10 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GLADE_ROOT: ${{ github.workspace }}
      GLADE_LWC_PLAYWRIGHT_MODULE: ${{ github.workspace }}/lwcruntime/node_modules/playwright
      GLADE_LWC_BROWSER: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install LWC toolchain
        timeout-minutes: 5
        run: npm ci --prefix third_party/lwc
      - name: Install browser conformance dependencies
        timeout-minutes: 5
        run: npm ci --prefix lwcruntime
      - name: Install conformance Chromium
        timeout-minutes: 65
        run: scripts/ci-install-playwright.sh ./lwcruntime/node_modules/.bin/playwright install --with-deps chromium
      - name: Run the remaining packages under the race detector
        run: |
          mapfile -t packages < <(go list ./... | grep -Ev \
            '^github\.com/glade-sh/glade/internal/(apextest|gladecli|server|vm|visualforce)$|^github\.com/glade-sh/glade/internal/lwc/compile$')
          echo "${#packages[@]} packages"
          go test -race -timeout=320m "${packages[@]}"
      - name: Summary
        if: always()
        run: 'echo "weekly full race, all remaining packages: ${{ job.status }}"'
