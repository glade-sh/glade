        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0
        run: echo "path=$(npm config get cache)" >>"$GITHUB_OUTPUT"
      - name: Restore and save benchmark npm cache
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        continue-on-error: true
        with:
          path: ${{ steps.benchmark-npm-cache.outputs.path }}
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}npm-cache-v1-${{ runner.os }}-${{ runner.arch }}-22-ci-smoke-distribution-${{ hashFiles('third_party/lwc/package-lock.json', 'contrib/vscode-glade/package-lock.json') }}
          restore-keys: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}npm-cache-v1-${{ runner.os }}-${{ runner.arch }}-22-ci-smoke-distribution-
      - run: npm ci --prefix third_party/lwc
      - run: scripts/smoke-distribution.sh
      - name: Save Go module cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-go-build-cache.outputs.cache-primary-key }}

  apextest-history-input:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.benchmark_cache_pair >= 0 && inputs.benchmark_cache_pair <= 999999) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_APEXTEST_HISTORY_PATH: /tmp/glade-apextest-duration-history/apextest-duration-history.json
      CI_DURATION_HISTORY_CACHE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate benchmark cache pair
        if: github.event_name == 'workflow_dispatch'
        run: scripts/ci-benchmark-cache-pair.sh "${{ inputs.benchmark_cache_pair }}"
      - name: Restore Apex duration history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: /tmp/glade-apextest-duration-history
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}apextest-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.6-${{ hashFiles('go.sum') }}-${{ env.CI_DURATION_HISTORY_CACHE_REF }}
      - name: Stage Apex duration history
        run: |
          mkdir -p ci-artifacts/apextest-history-input
          if [[ -s "$CI_APEXTEST_HISTORY_PATH" ]]; then
            cp "$CI_APEXTEST_HISTORY_PATH" ci-artifacts/apextest-history-input/apextest-duration-history.json
          fi
          : >ci-artifacts/apextest-history-input/ready
      - name: Upload Apex duration history input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: apextest-history-input
          path: ci-artifacts/apextest-history-input/
          if-no-files-found: error

  apextest:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.benchmark_cache_pair >= 0 && inputs.benchmark_cache_pair <= 999999) }}
    needs: apextest-history-input
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: "6GiB"
      GOMODCACHE: /tmp/go-mod-ci-apextest-${{ matrix.shard }}
      GOCACHE: /tmp/go-build-ci-apextest-${{ matrix.shard }}
      CI_APEXTEST_ARTIFACT_DIR: ci-artifacts/apextest-${{ matrix.shard }}
      CI_APEXTEST_HISTORY_PATH: /tmp/glade-apextest-duration-history/apextest-duration-history.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate benchmark cache pair
        if: github.event_name == 'workflow_dispatch'
        run: scripts/ci-benchmark-cache-pair.sh "${{ inputs.benchmark_cache_pair }}"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Download shared Apex duration history
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: apextest-history-input
          path: /tmp/glade-apextest-duration-history
      - name: Restore Apex module cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}go-mod-v1-1.26.6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-apextest-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}go-mod-v1-1.26.6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-apextest-${{ matrix.shard }}-
      - name: Restore Apex build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}go-build-v1-1.26.6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-apextest-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}go-build-v1-1.26.6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-apextest-${{ matrix.shard }}-
      - name: Run Apex shard
        run: scripts/ci-resource-run.sh "$CI_APEXTEST_ARTIFACT_DIR/resource-usage.json" "apextest-${{ matrix.shard }}" -- scripts/ci-go-test.sh apex-shard "${{ matrix.shard }}"
      - name: Upload Apex shard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: apex-shard-${{ matrix.shard }}
          path: |
            ci-artifacts/apextest-${{ matrix.shard }}/discovery.txt
            ci-artifacts/apextest-${{ matrix.shard }}/discovery-stderr.txt
            ci-artifacts/apextest-${{ matrix.shard }}/discovery-command.txt
            ci-artifacts/apextest-${{ matrix.shard }}/plan.json
            ci-artifacts/apextest-${{ matrix.shard }}/selected-shard.json
            ci-artifacts/apextest-${{ matrix.shard }}/events.json
            ci-artifacts/apextest-${{ matrix.shard }}/validation-summary.json
            ci-artifacts/apextest-${{ matrix.shard }}/resource-usage.json
          if-no-files-found: error

  apextest-history:
    needs: apextest
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download successful Apex shard evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: apex-shard-*
          path: /tmp/apextest-history-input
      - name: Refresh and guard Apex duration history
        run: scripts/ci-go-test.sh apex-history-refresh /tmp/apextest-history-input/apex-shard-0 /tmp/apextest-history-input/apex-shard-1 /tmp/glade-apextest-duration-history/apextest-duration-history.json
      - name: Save Apex duration history
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: /tmp/glade-apextest-duration-history
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}apextest-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.6-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: Upload Apex duration history evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: apextest-duration-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/glade-apextest-duration-history/apextest-duration-history.json
          if-no-files-found: error

  required-ci:
    name: Required CI
    needs:
      - site
      - vet
      - apextest
      - apextest-history
      - gladecli
      - node-integration
      - nested-sources
      - sema
      - sema-history
      - server-and-playground
      - test
      - smoke-runtime
      - smoke-distribution
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS")"
          if [[ -n "$failures" ]]; then
            printf '%s\n' "$failures"
            exit 1
          fi

  required-scheduled-ci:
    name: Required Scheduled CI
    needs:
      - required-ci
      - sema-full
      - sema-equivalence
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all scheduled CI jobs
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS")"
          if [[ -n "$failures" ]]; then
            printf '%s\n' "$failures"
            exit 1
          fi
