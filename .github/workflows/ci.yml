    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.benchmark_cache_pair >= 0 && inputs.benchmark_cache_pair <= 999999)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    env:
      CI_VISUALFORCE_HISTORY_PATH: /tmp/glade-visualforce-duration-history/visualforce-duration-history.json
      CI_DURATION_HISTORY_CACHE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate benchmark cache pair
        if: github.event_name == 'workflow_dispatch'
        run: scripts/ci-benchmark-cache-pair.sh "${{ inputs.benchmark_cache_pair }}"
      - name: Restore Visualforce duration history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: /tmp/glade-visualforce-duration-history
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}visualforce-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}-${{ env.CI_DURATION_HISTORY_CACHE_REF }}
      - name: Find predecessor Visualforce evidence
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.benchmark_cache_pair == 0 }}
        id: predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s "$CI_VISUALFORCE_HISTORY_PATH" ]]; then exit 0; fi
          if ! run_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$CI_DURATION_HISTORY_CACHE_REF" -f status=success -f per_page=1 --jq '.workflow_runs[0].id // empty')"; then
            echo "::warning::Predecessor timing lookup unavailable; using deterministic scheduling fallback"
            exit 0
          fi
          if [[ -z "$run_id" ]]; then exit 0; fi
          if ! artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')"; then
            echo "::warning::Predecessor artifacts unavailable; using deterministic scheduling fallback"
            exit 0
          fi
          complete=true
          for index in {0..3}; do
            if ! grep -Fxq "go-test-visualforce-shard-$index" <<<"$artifacts"; then complete=false; fi
          done
          if [[ "$complete" == true ]]; then
            format=shards
          elif grep -Fxq go-test-remaining-go <<<"$artifacts"; then
            format=serial
          else
            echo "::warning::Predecessor Visualforce evidence unavailable; using deterministic scheduling fallback"
            exit 0
          fi
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          echo "format=$format" >>"$GITHUB_OUTPUT"
      - name: Download predecessor Visualforce shard evidence
        if: steps.predecessor.outputs.format == 'shards'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.predecessor.outputs.run_id }}
          pattern: go-test-visualforce-shard-*
          path: /tmp/visualforce-predecessor
      - name: Download predecessor serial Visualforce evidence
        if: steps.predecessor.outputs.format == 'serial'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.predecessor.outputs.run_id }}
          name: go-test-remaining-go
          path: /tmp/visualforce-predecessor
      - name: Bootstrap validated Visualforce duration history
        if: steps.predecessor.outputs.run_id != ''
        run: |
          if [[ "${{ steps.predecessor.outputs.format }}" == shards ]]; then
            command=(scripts/ci-go-test.sh visualforce-history-refresh "$CI_VISUALFORCE_HISTORY_PATH" /tmp/visualforce-predecessor/go-test-visualforce-shard-{0..3})
          else
            command=(scripts/ci-go-test.sh visualforce-history-bootstrap "$CI_VISUALFORCE_HISTORY_PATH" /tmp/visualforce-predecessor/test-remaining-go-visualforce.json)
          fi
          if ! "${command[@]}"; then
            rm -f "$CI_VISUALFORCE_HISTORY_PATH"
            echo "::warning::Predecessor Visualforce timing evidence unavailable or invalid; using deterministic scheduling fallback"
          fi
      - name: Stage Visualforce duration history
        run: |
          mkdir -p ci-artifacts/visualforce-history-input
          if [[ -s "$CI_VISUALFORCE_HISTORY_PATH" ]]; then
            cp "$CI_VISUALFORCE_HISTORY_PATH" ci-artifacts/visualforce-history-input/visualforce-duration-history.json
          fi
          : >ci-artifacts/visualforce-history-input/ready
      - name: Upload Visualforce duration history input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: visualforce-history-input
          path: ci-artifacts/visualforce-history-input/
          if-no-files-found: error

