  test:
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.benchmark_cache_pair >= 0 && inputs.benchmark_cache_pair <= 999999) }}
    needs: [lwc-compile-history-input, visualforce-history-input, test-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: remaining-go
            name: test
          - lane: lwc-compile-0
            name: LWC compile (0)
            shard: 0
          - lane: lwc-compile-1
            name: LWC compile (1)
            shard: 1
          - lane: lwc-compile-2
            name: LWC compile (2)
            shard: 2
          - lane: lwc-compile-3
            name: LWC compile (3)
            shard: 3
          - lane: lwc-compile-4
            name: LWC compile (4)
            shard: 4
          - lane: lwc-compile-5
            name: LWC compile (5)
            shard: 5
          - lane: lwc-compile-6
            name: LWC compile (6)
            shard: 6
          - lane: lwc-compile-7
            name: LWC compile (7)
            shard: 7
          - lane: visualforce-0
            name: Visualforce (0)
            shard: 0
          - lane: visualforce-1
            name: Visualforce (1)
            shard: 1
          - lane: visualforce-2
            name: Visualforce (2)
            shard: 2
          - lane: visualforce-3
            name: Visualforce (3)
            shard: 3
    env:
      CGO_ENABLED: "1"
      CI_TEST_BIN_DIR: ${{ matrix.lane != 'remaining-go' && '/tmp/glade-test-binaries' || '' }}
      GOMAXPROCS: "2"
      CI_LWC_COMPILE_HISTORY_PATH: /tmp/glade-lwc-compile-duration-history/lwc-compile-duration-history.json
      CI_VISUALFORCE_HISTORY_PATH: /tmp/glade-visualforce-duration-history/visualforce-duration-history.json
      # CI enables colored Babel code frames; native diagnostic fixtures are plain text.
      NO_COLOR: "1"
      GLADE_LWC_PLAYWRIGHT_MODULE: ${{ github.workspace }}/lwcruntime/node_modules/playwright
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download shared test binaries
        if: matrix.lane != 'remaining-go'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: test-binaries-${{ startsWith(matrix.lane, 'lwc-compile-') && 'lwc-compile' || 'visualforce' }}-${{ github.run_id }}-${{ needs.test-binaries.outputs.artifact-attempt }}
          path: /tmp/glade-test-binaries
      - name: Validate benchmark cache pair
        if: github.event_name == 'workflow_dispatch'
        run: scripts/ci-benchmark-cache-pair.sh "${{ inputs.benchmark_cache_pair }}"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Download shared LWC duration history
        if: startsWith(matrix.lane, 'lwc-compile-')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lwc-compile-history-input
          path: /tmp/glade-lwc-compile-duration-history
      - name: Download shared Visualforce duration history
        if: startsWith(matrix.lane, 'visualforce-')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: visualforce-history-input
          path: /tmp/glade-visualforce-duration-history
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-ci-test-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          restore-keys: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-ci-test-${{ hashFiles('go.sum') }}-
      - name: Report Go module cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-mod-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] module restored-key=$MATCHED_KEY"
          else
            echo "[cache] module miss"
          fi
          bytes=0
          if [[ -d "$HOME/go/pkg/mod" ]]; then
            bytes="$(du -sb "$HOME/go/pkg/mod" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] module bytes=$bytes"
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-ci-test-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          restore-keys: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-ci-test-${{ hashFiles('go.sum') }}-
      - name: Report Go build cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-build-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] build restored-key=$MATCHED_KEY"
          else
            echo "[cache] build miss"
          fi
          bytes=0
          if [[ -d "$HOME/.cache/go-build" ]]; then
            bytes="$(du -sb "$HOME/.cache/go-build" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] build bytes=$bytes"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install LWC conformance dependencies
        run: npm ci --prefix third_party/lwc
      - name: Install browser conformance dependencies
        run: npm ci --prefix lwcruntime
      - name: Install conformance Chromium
        run: scripts/ci-install-playwright.sh ./lwcruntime/node_modules/.bin/playwright install --with-deps chromium
      - run: scripts/ci-resource-run.sh ci-artifacts/go-test/resource-repoguard.json repoguard -- scripts/ci-go-test.sh lane repoguard
        if: matrix.lane == 'remaining-go'
      - run: scripts/ci-resource-run.sh ci-artifacts/go-test/resource-remaining-go.json remaining-go -- scripts/ci-go-test.sh lane remaining-go
        if: matrix.lane == 'remaining-go'
      - name: Test LWC compile shard
        if: startsWith(matrix.lane, 'lwc-compile-')
        run: scripts/ci-resource-run.sh ci-artifacts/lwc-compile-${{ matrix.shard }}/resource-usage.json lwc-compile-${{ matrix.shard }} -- scripts/ci-go-test.sh lwc-compile-shard "${{ matrix.shard }}"
      - name: Test Visualforce shard
        if: startsWith(matrix.lane, 'visualforce-')
        run: scripts/ci-resource-run.sh ci-artifacts/visualforce-${{ matrix.shard }}/resource-usage.json visualforce-${{ matrix.shard }} -- scripts/ci-go-test.sh visualforce-shard "${{ matrix.shard }}"
      - name: Save Go module cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-go-build-cache.outputs.cache-primary-key }}
      - name: Upload raw Go test events
        if: always() && matrix.lane == 'remaining-go'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: go-test-remaining-go
          path: |
            ci-artifacts/go-test/test-repoguard.json
            ci-artifacts/go-test/test-remaining-go.json
            ci-artifacts/go-test/resource-repoguard.json
            ci-artifacts/go-test/resource-remaining-go.json
          if-no-files-found: error
      - name: Upload LWC compile shard events
        if: always() && startsWith(matrix.lane, 'lwc-compile-')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: go-test-lwc-compile-shard-${{ matrix.shard }}
          path: ci-artifacts/lwc-compile-${{ matrix.shard }}/
          if-no-files-found: error

      - name: Upload Visualforce shard events
        if: always() && startsWith(matrix.lane, 'visualforce-')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: go-test-visualforce-shard-${{ matrix.shard }}
          path: ci-artifacts/visualforce-${{ matrix.shard }}/
