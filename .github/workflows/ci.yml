        id: predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s "$CI_VISUALFORCE_HISTORY_PATH" ]]; then exit 0; fi
          if ! run_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$CI_DURATION_HISTORY_CACHE_REF" -f status=success -f per_page=1 --jq '.workflow_runs[0].id // empty')"; then
            echo "::warning::Predecessor timing lookup unavailable; using deterministic scheduling fallback"
            exit 0
          fi
          if [[ -z "$run_id" ]]; then exit 0; fi
          if ! artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')"; then
            echo "::warning::Predecessor artifacts unavailable; using deterministic scheduling fallback"
            exit 0
          fi
          complete=true
          for index in {0..3}; do
            if ! grep -Fxq "go-test-visualforce-shard-$index" <<<"$artifacts"; then complete=false; fi
