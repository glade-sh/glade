name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/oaer compat mvp --json
      - run: go run ./cmd/oaer compat dashboard --check docs/COMPATIBILITY_DASHBOARD.md
      - run: go run ./cmd/oaer compat gaps --check docs/KNOWN_GAPS.md
      - run: go run ./cmd/oaer compat stdlib --check docs/STDLIB_COVERAGE.md
      - run: scripts/apex-docs-support-gate.sh
      - run: scripts/smoke.sh
      - run: go test -race ./...

  post-parity-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./cmd/oaer compat local-tests --check docs/fixtures/local-tests-corpus.json
      - run: go run ./cmd/oaer compat post-parity --json --require-ready
      - run: go run ./cmd/oaer compat ui-controllers --check docs/fixtures/ui-controller-discovery.json
