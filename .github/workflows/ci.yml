  required-ci:
    name: Required CI
    needs:
      - codeql
      - workflow-lint
      - site
      - test-binaries
      - vet
      - apextest
      - apextest-history
      - lwc-compile-history
      - visualforce-history
      - gladecli
      - node-integration
      - nested-sources
      - sema
      - sema-history
      - server-and-playground
      - test
      - smoke-runtime
      - smoke-distribution
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS")"
          if [[ -n "$failures" ]]; then
            printf '%s\n' "$failures"
            exit 1
          fi

  required-scheduled-ci:
    name: Required Scheduled CI
    needs:
      - required-ci
      - sema-full
      - sema-equivalence
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all scheduled CI jobs
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS")"
          if [[ -n "$failures" ]]; then
            printf '%s\n' "$failures"
            exit 1
          fi
