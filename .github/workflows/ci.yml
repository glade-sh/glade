    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate benchmark cache pair
        if: github.event_name == 'workflow_dispatch'
        run: scripts/ci-benchmark-cache-pair.sh "${{ inputs.benchmark_cache_pair }}"
      - name: Restore Apex duration history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: /tmp/glade-apextest-duration-history
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}apextest-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}-${{ env.CI_DURATION_HISTORY_CACHE_REF }}
      - name: Stage Apex duration history
        run: |
          mkdir -p ci-artifacts/apextest-history-input
          if [[ -s "$CI_APEXTEST_HISTORY_PATH" ]]; then
            cp "$CI_APEXTEST_HISTORY_PATH" ci-artifacts/apextest-history-input/apextest-duration-history.json
          fi
