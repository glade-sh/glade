name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm test --prefix site
      - run: npm run build --prefix site

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-vet-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-vet-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-vet-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-vet-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - run: go vet ./...
      - name: Save Go module cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-go-build-cache.outputs.cache-primary-key }}

  gladecli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-gladecli-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-gladecli-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-gladecli-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-gladecli-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - run: scripts/ci-go-test.sh lane gladecli
      - name: Save Go module cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-go-build-cache.outputs.cache-primary-key }}
      - name: Upload raw Go test events
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-test-gladecli
          path: ci-artifacts/go-test/test-gladecli.json
          if-no-files-found: error

  node-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOMODCACHE: /tmp/go-mod-ci-node-integration
      GOCACHE: /tmp/go-build-ci-node-integration
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Node integration Go module cache
        id: restore-node-integration-go-mod-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-node-integration-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-node-integration-${{ hashFiles('go.sum') }}-
      - name: Restore Node integration Go build cache
        id: restore-node-integration-go-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-node-integration-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-node-integration-${{ hashFiles('go.sum') }}-
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: third_party/lwc/package-lock.json
      - run: npm ci --prefix third_party/lwc
      - run: scripts/ci-go-test.sh node-integration
      - name: Save Node integration Go module cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.GOMODCACHE }}
          key: ${{ steps.restore-node-integration-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Node integration Go build cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ steps.restore-node-integration-go-build-cache.outputs.cache-primary-key }}
      - name: Upload Node integration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-test-node-integration
          path: |
            ci-artifacts/go-test-node-integration/test-node-integration.json
            ci-artifacts/go-test-node-integration/expected.txt
            ci-artifacts/go-test-node-integration/discovery.txt
            ci-artifacts/go-test-node-integration/validation-summary.json
          if-no-files-found: error

  sema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      GOMAXPROCS: "2"
      GOMODCACHE: /tmp/go-mod-ci-sema-${{ matrix.shard }}
      GOCACHE: /tmp/go-build-ci-sema-${{ matrix.shard }}
      CI_SEMA_ARTIFACT_DIR: ci-artifacts/sema-${{ matrix.shard }}
      CI_SEMA_HISTORY_PATH: /tmp/glade-sema-duration-history/sema-duration-history.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore sema duration history
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: /tmp/glade-sema-duration-history
          key: sema-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sema-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-${{ hashFiles('go.sum') }}-
      - name: Restore and save isolated sema module cache
        uses: actions/cache@v5
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-sema-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-sema-${{ matrix.shard }}-
      - name: Restore and save isolated sema build cache
        uses: actions/cache@v5
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-sema-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-sema-${{ matrix.shard }}-
      - name: Run sema shard
        run: scripts/ci-go-test.sh sema-shard "${{ matrix.shard }}"
      - name: Upload sema shard evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sema-shard-${{ matrix.shard }}
          path: ci-artifacts/sema-${{ matrix.shard }}/
          if-no-files-found: error

  sema-history:
    needs: sema
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Download successful sema shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: sema-shard-*
          path: /tmp/sema-history-input
      - name: Refresh sema duration history
        run: scripts/ci-go-test.sh sema-history-refresh /tmp/sema-history-input/sema-shard-0 /tmp/sema-history-input/sema-shard-1 /tmp/glade-sema-duration-history/sema-duration-history.json
      - name: Save sema duration history
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/glade-sema-duration-history
          key: sema-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload sema duration history evidence
        uses: actions/upload-artifact@v6
        with:
          name: sema-duration-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/glade-sema-duration-history/sema-duration-history.json
          if-no-files-found: error

  sema-full:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOMODCACHE: /tmp/go-mod-ci-sema-full
      GOCACHE: /tmp/go-build-ci-sema-full
      CI_SEMA_FULL_ARTIFACT_DIR: ci-artifacts/sema-full
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore sema full module cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-sema-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-sema-full-
      - name: Restore sema full build cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-sema-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-sema-full-
      - name: Run sema full oracle
        run: scripts/ci-go-test.sh sema-full
      - name: Upload sema full evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sema-full
          path: ci-artifacts/sema-full/
          if-no-files-found: error

  sema-equivalence:
    needs:
      - sema
      - sema-full
    if: ${{ github.event_name == 'schedule' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Download sema evidence
        uses: actions/download-artifact@v7
        with:
          pattern: sema-*
          path: /tmp/sema-equivalence-input
      - name: Verify exact sema equivalence
        run: scripts/ci-go-test.sh sema-equivalence /tmp/sema-equivalence-input/sema-shard-0 /tmp/sema-equivalence-input/sema-shard-1 /tmp/sema-equivalence-input/sema-full /tmp/sema-equivalence/equivalence.json
      - name: Upload sema equivalence evidence
        uses: actions/upload-artifact@v6
        with:
          name: sema-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sema-equivalence/equivalence.json
          if-no-files-found: error

  server-and-playground:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-server-playground-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-server-playground-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-server-playground-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-server-playground-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - run: scripts/ci-go-test.sh lane server-and-playground
      - name: Save Go module cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-go-build-cache.outputs.cache-primary-key }}
      - name: Upload raw Go test events
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-test-server-and-playground
          path: ci-artifacts/go-test/test-server-and-playground.json
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - name: Report Go module cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-mod-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] module restored-key=$MATCHED_KEY"
          else
            echo "[cache] module miss"
          fi
          bytes=0
          if [[ -d "$HOME/go/pkg/mod" ]]; then
            bytes="$(du -sb "$HOME/go/pkg/mod" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] module bytes=$bytes"
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - name: Report Go build cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-build-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] build restored-key=$MATCHED_KEY"
          else
            echo "[cache] build miss"
          fi
          bytes=0
          if [[ -d "$HOME/.cache/go-build" ]]; then
            bytes="$(du -sb "$HOME/.cache/go-build" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] build bytes=$bytes"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: scripts/ci-go-test.sh lane repoguard
      - run: scripts/ci-go-test.sh lane remaining-go
      - name: Save Go module cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-go-build-cache.outputs.cache-primary-key }}
      - name: Upload raw Go test events
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-test-remaining-go
          path: |
            ci-artifacts/go-test/test-repoguard.json
            ci-artifacts/go-test/test-remaining-go.json
          if-no-files-found: error

  smoke-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-smoke-runtime-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-smoke-runtime-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-smoke-runtime-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-smoke-runtime-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - run: CGO_ENABLED=1 go build -o "$RUNNER_TEMP/glade" ./cmd/glade
      - run: scripts/smoke-runtime.sh "$RUNNER_TEMP/glade"
      - name: Save Go module cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-go-build-cache.outputs.cache-primary-key }}

  smoke-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-smoke-distribution-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-smoke-distribution-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-smoke-distribution-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-smoke-distribution-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            third_party/lwc/package-lock.json
            contrib/vscode-glade/package-lock.json
      - run: npm ci --prefix third_party/lwc
      - run: scripts/smoke-distribution.sh
      - name: Save Go module cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ steps.restore-go-build-cache.outputs.cache-primary-key }}

  apextest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      GOMAXPROCS: "2"
      GOMODCACHE: /tmp/go-mod-ci-apextest-${{ matrix.shard }}
      GOCACHE: /tmp/go-build-ci-apextest-${{ matrix.shard }}
      CI_APEXTEST_ARTIFACT_DIR: ci-artifacts/apextest-${{ matrix.shard }}
      CI_APEXTEST_HISTORY_PATH: /tmp/glade-apextest-duration-history/apextest-duration-history.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Apex duration history
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: /tmp/glade-apextest-duration-history
          key: apextest-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          restore-keys: |
            apextest-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-${{ hashFiles('go.sum') }}-
            apextest-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-
      - name: Restore Apex module cache
        uses: actions/cache@v5
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-apextest-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-apextest-${{ matrix.shard }}-
      - name: Restore Apex build cache
        uses: actions/cache@v5
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-apextest-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-v1-1.26.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-ci-apextest-${{ matrix.shard }}-
      - name: Run Apex shard
        run: scripts/ci-go-test.sh apex-shard "${{ matrix.shard }}"
      - name: Upload Apex shard evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apex-shard-${{ matrix.shard }}
          path: |
            ci-artifacts/apextest-${{ matrix.shard }}/discovery.txt
            ci-artifacts/apextest-${{ matrix.shard }}/discovery-stderr.txt
            ci-artifacts/apextest-${{ matrix.shard }}/discovery-command.txt
            ci-artifacts/apextest-${{ matrix.shard }}/plan.json
            ci-artifacts/apextest-${{ matrix.shard }}/selected-shard.json
            ci-artifacts/apextest-${{ matrix.shard }}/events.json
            ci-artifacts/apextest-${{ matrix.shard }}/validation-summary.json
          if-no-files-found: error

  apextest-history:
    needs: apextest
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Download successful Apex shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: apex-shard-*
          path: /tmp/apextest-history-input
      - name: Refresh and guard Apex duration history
        run: scripts/ci-go-test.sh apex-history-refresh /tmp/apextest-history-input/apex-shard-0 /tmp/apextest-history-input/apex-shard-1 /tmp/glade-apextest-duration-history/apextest-duration-history.json
      - name: Save Apex duration history
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/glade-apextest-duration-history
          key: apextest-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Apex duration history evidence
        uses: actions/upload-artifact@v6
        with:
          name: apextest-duration-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/glade-apextest-duration-history/apextest-duration-history.json
          if-no-files-found: error

  required-ci:
    name: Required CI
    needs:
      - site
      - vet
      - apextest
      - apextest-history
      - gladecli
      - node-integration
      - sema
      - sema-history
      - server-and-playground
      - test
      - smoke-runtime
      - smoke-distribution
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS")"
          if [[ -n "$failures" ]]; then
            printf '%s\n' "$failures"
            exit 1
          fi

  required-scheduled-ci:
    name: Required Scheduled CI
    needs:
      - required-ci
      - sema-full
      - sema-equivalence
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all scheduled CI jobs
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS")"
          if [[ -n "$failures" ]]; then
            printf '%s\n' "$failures"
            exit 1
          fi
