  apextest:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.benchmark_cache_pair >= 0 && inputs.benchmark_cache_pair <= 999999) }}
    needs: [apextest-history-input, test-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      CGO_ENABLED: "1"
      CI_TEST_BIN_DIR: /tmp/glade-test-binaries
      GOMAXPROCS: "2"
      GOMEMLIMIT: "6GiB"
      GOMODCACHE: /tmp/go-mod-ci-apextest-${{ matrix.shard }}
