  lwc-compile-history-input:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.benchmark_cache_pair >= 0 && inputs.benchmark_cache_pair <= 999999)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    env:
      CI_LWC_COMPILE_HISTORY_PATH: /tmp/glade-lwc-compile-duration-history/lwc-compile-duration-history.json
      CI_DURATION_HISTORY_CACHE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate benchmark cache pair
        if: github.event_name == 'workflow_dispatch'
        run: scripts/ci-benchmark-cache-pair.sh "${{ inputs.benchmark_cache_pair }}"
      - name: Restore LWC compile duration history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: /tmp/glade-lwc-compile-duration-history
          key: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_cache_pair > 0 && inputs.benchmark_cache_pair <= 999999 && format('w2-6d-{0}-', inputs.benchmark_cache_pair) || '' }}lwc-compile-duration-history-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}-${{ env.CI_DURATION_HISTORY_CACHE_REF }}
      - name: Find predecessor LWC shard evidence
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.benchmark_cache_pair == 0 }}
        id: predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s "$CI_LWC_COMPILE_HISTORY_PATH" ]]; then exit 0; fi
          if ! run_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$CI_DURATION_HISTORY_CACHE_REF" -f status=success -f per_page=1 --jq '.workflow_runs[0].id // empty')"; then
            echo "::warning::Predecessor timing lookup unavailable; using deterministic scheduling fallback"
            exit 0
          fi
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
      - name: Download predecessor LWC shard evidence
        if: steps.predecessor.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.predecessor.outputs.run_id }}
          pattern: go-test-lwc-compile-shard-*
          path: /tmp/lwc-compile-predecessor
      - name: Bootstrap validated LWC duration history
        if: steps.predecessor.outputs.run_id != ''
        run: |
          if ! scripts/ci-go-test.sh lwc-compile-history-refresh "$CI_LWC_COMPILE_HISTORY_PATH" /tmp/lwc-compile-predecessor/go-test-lwc-compile-shard-{0..7}; then
            rm -f "$CI_LWC_COMPILE_HISTORY_PATH"
            echo "::warning::Predecessor LWC timing evidence unavailable or invalid; using deterministic scheduling fallback"
          fi
      - name: Stage LWC compile duration history
        run: |
          mkdir -p ci-artifacts/lwc-compile-history-input
          if [[ -s "$CI_LWC_COMPILE_HISTORY_PATH" ]]; then
            cp "$CI_LWC_COMPILE_HISTORY_PATH" ci-artifacts/lwc-compile-history-input/lwc-compile-duration-history.json
          fi
          : >ci-artifacts/lwc-compile-history-input/ready
      - name: Upload LWC compile duration history input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lwc-compile-history-input
          path: ci-artifacts/lwc-compile-history-input/
          if-no-files-found: error

