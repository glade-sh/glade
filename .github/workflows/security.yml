name: Security

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-security-govulncheck-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-ci-test-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-ci-test-
      - name: Report Go module cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-mod-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] module restored-key=$MATCHED_KEY"
          else
            echo "[cache] module miss"
          fi
          bytes=0
          if [[ -d "$HOME/go/pkg/mod" ]]; then
            bytes="$(du -sb "$HOME/go/pkg/mod" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] module bytes=$bytes"
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-security-govulncheck-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-ci-test-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-ci-test-
      - name: Report Go build cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-build-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] build restored-key=$MATCHED_KEY"
          else
            echo "[cache] build miss"
          fi
          bytes=0
          if [[ -d "$HOME/.cache/go-build" ]]; then
            bytes="$(du -sb "$HOME/.cache/go-build" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] build bytes=$bytes"
      - name: Run Go vulnerability reachability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./... # v1.6.0

  codeql-scope:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type != 'tag')
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select fast CodeQL scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/codeql-paths"
            echo "run=$(python3 scripts/ci-codeql-scope.py < "$RUNNER_TEMP/codeql-paths")" >> "$GITHUB_OUTPUT"
          fi

  codeql-fast:
    name: CodeQL
    needs: [codeql-scope]
    if: needs.codeql-scope.outputs.run == 'true'
    uses: ./.github/workflows/codeql.yml
    with:
      profile: fast
    permissions:
      actions: read
      contents: read
      security-events: write

  codeql:
    name: CodeQL
    if: github.ref_type != 'tag' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/codeql.yml
    with:
      profile: full
    permissions:
      actions: read
      contents: read
      security-events: write

  gosec:
    name: gosec
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-security-gosec-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-ci-test-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-ci-test-
      - name: Report Go module cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-mod-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] module restored-key=$MATCHED_KEY"
          else
            echo "[cache] module miss"
          fi
          bytes=0
          if [[ -d "$HOME/go/pkg/mod" ]]; then
            bytes="$(du -sb "$HOME/go/pkg/mod" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] module bytes=$bytes"
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-security-gosec-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-ci-test-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.27.4-ci-test-
      - name: Report Go build cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-build-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] build restored-key=$MATCHED_KEY"
          else
            echo "[cache] build miss"
          fi
          bytes=0
          if [[ -d "$HOME/.cache/go-build" ]]; then
            bytes="$(du -sb "$HOME/.cache/go-build" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] build bytes=$bytes"
      - name: Run gosec security scanner
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: gosec.sarif

  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Audit packaged LWC runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: third_party/lwc
      - name: Audit VS Code extension production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: contrib/vscode-glade

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
