name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-security-govulncheck-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-
      - name: Report Go module cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-mod-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] module restored-key=$MATCHED_KEY"
          else
            echo "[cache] module miss"
          fi
          bytes=0
          if [[ -d "$HOME/go/pkg/mod" ]]; then
            bytes="$(du -sb "$HOME/go/pkg/mod" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] module bytes=$bytes"
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-security-govulncheck-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-
      - name: Report Go build cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-build-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] build restored-key=$MATCHED_KEY"
          else
            echo "[cache] build miss"
          fi
          bytes=0
          if [[ -d "$HOME/.cache/go-build" ]]; then
            bytes="$(du -sb "$HOME/.cache/go-build" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] build bytes=$bytes"
      - name: Run Go vulnerability reachability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./... # v1.6.0

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-security-codeql-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-
      - name: Report Go module cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-mod-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] module restored-key=$MATCHED_KEY"
          else
            echo "[cache] module miss"
          fi
          bytes=0
          if [[ -d "$HOME/go/pkg/mod" ]]; then
            bytes="$(du -sb "$HOME/go/pkg/mod" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] module bytes=$bytes"
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-security-codeql-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-
      - name: Report Go build cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-build-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] build restored-key=$MATCHED_KEY"
          else
            echo "[cache] build miss"
          fi
          bytes=0
          if [[ -d "$HOME/.cache/go-build" ]]; then
            bytes="$(du -sb "$HOME/.cache/go-build" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] build bytes=$bytes"
      - name: Initialize pull request CodeQL
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: go
          config: |
            queries:
              - uses: security-extended
            query-filters:
              - exclude:
                  id:
                    # These three did not finish in PR diff-informed run
                    # 31262200837 after 32 of 35 queries completed.
                    - go/incomplete-hostname-regexp
                    - go/regex/missing-regexp-anchor
                    - go/weak-sensitive-data-hashing
                    # This query alone exceeded 60 minutes in run 29155739678.
                    - go/allocation-size-overflow
                    # This query was the only one still running when PR run
                    # 30205055311 hit its 60-minute job timeout.
                    - go/incorrect-integer-conversion
          build-mode: manual
      - name: Initialize full-branch CodeQL
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: go
          config: |
            queries:
              - uses: security-extended
            query-filters:
              - exclude:
                  id:
                    # These three did not finish in PR diff-informed run
                    # 31262200837 after 32 of 35 queries completed.
                    - go/incomplete-hostname-regexp
                    - go/regex/missing-regexp-anchor
                    - go/weak-sensitive-data-hashing
                    # This query alone exceeded 60 minutes in run 29155739678.
                    - go/allocation-size-overflow
                    # These five did not terminate in isolated four-thread jobs,
                    # including with a 10 GiB evaluator cache (runs 30133474104
                    # and 30134359448). PR diff-informed analysis retains them.
                    - go/reflected-xss
                    - go/weak-sensitive-data-hashing
                    - go/bad-redirect-check
                    - go/incorrect-integer-conversion
                    - go/uncontrolled-allocation-size
          build-mode: manual
      - name: Build Glade for CodeQL
        run: go build -o "${RUNNER_TEMP}/glade-codeql" ./cmd/glade
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Restore Go module cache
        id: restore-go-mod-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-security-gosec-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
            go-mod-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-
      - name: Report Go module cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-mod-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] module restored-key=$MATCHED_KEY"
          else
            echo "[cache] module miss"
          fi
          bytes=0
          if [[ -d "$HOME/go/pkg/mod" ]]; then
            bytes="$(du -sb "$HOME/go/pkg/mod" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] module bytes=$bytes"
      - name: Restore Go build cache
        id: restore-go-build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-security-gosec-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-${{ hashFiles('go.sum') }}-
            go-build-cache-v1-${{ runner.os }}-${{ runner.arch }}-1.26.5-ci-test-
      - name: Report Go build cache restore
        env:
          MATCHED_KEY: ${{ steps.restore-go-build-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" ]]; then
            echo "[cache] build restored-key=$MATCHED_KEY"
          else
            echo "[cache] build miss"
          fi
          bytes=0
          if [[ -d "$HOME/.cache/go-build" ]]; then
            bytes="$(du -sb "$HOME/.cache/go-build" 2>/dev/null | awk '{print $1}')" || bytes=0
          fi
          echo "[cache] build bytes=$bytes"
      - name: Run gosec security scanner
        uses: securego/gosec@9e6a9843d7a4a6e3e9a8539b02612c8a4aa3f889 # v2.27.1
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: gosec.sarif

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Audit packaged LWC runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: third_party/lwc
      - name: Audit VS Code extension production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: contrib/vscode-glade

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: scorecard.sarif
